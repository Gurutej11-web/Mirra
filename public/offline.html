<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Mirra</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0a0c; color: #f4efea; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      h1 { font-family: Georgia, serif; font-weight: 400; font-size: 44px; margin: 16px 0 8px; }
      p { color: #a59ea6; max-width: 320px; margin: 0 auto; line-height: 1.5; }
      button { margin-top: 24px; background: #e8a98f; color: #1a0f0b; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>Mirra needs a connection to load your closet. Check your Wi-Fi or data and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
